name: P10 R6 multirate CI
on:
  push:
    branches:
      - petar/ssi263-p10r6-multirate-speech-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace
        run: |
          test -f boards/a2n20v2-Enhanced/hdl/ssi263_hybrid_bridge.sv
          echo "P10 R6 workspace ready"
