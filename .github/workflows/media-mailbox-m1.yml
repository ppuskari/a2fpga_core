name: M1 ROMless slot3 Media Mailbox and direct HDMI PCM regressions
on:
  push:
    branches:
      - petar/media-mailbox-m1-slot3-console-20261120
      - petar/mod-jukebox-j1-20261121
      - petar/mod-jukebox-j2-largefile-20261121
      - petar/mod-j2r3-8ch-gain-20261121
      - petar/media-m2-bidir-fat-picker-20261122
  pull_request:
  workflow_dispatch:
jobs:
  slot3-mailbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL verification and independent synthesis tools
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog yosys
      - name: Exercise mailbox through an independent Yosys synthesis pass
        run: |
          yosys -Q -T -p 'read_verilog -sv boards/a2n20v2-Enhanced/hdl/media_mailbox_slot3.sv; synth -top media_mailbox_slot3; stat' > /tmp/m1_yosys.log
          grep -q 'media_mailbox_slot3' /tmp/m1_yosys.log
          tail -n 38 /tmp/m1_yosys.log
      - name: Verify Apple IIe/IIgs ROMless slot3 SPI7 mailbox
        run: |
          iverilog -g2012 -s tb_media_mailbox_slot3 -o /tmp/m1 boards/a2n20v2-Enhanced/hdl/media_mailbox_slot3.sv boards/a2n20v2-Enhanced/tests/tb_media_mailbox_slot3.sv
          vvp /tmp/m1
      - name: Verify M2 bidirectional Apple reply FIFO and unchanged M1 ABI
        run: |
          iverilog -g2012 -s tb_media_mailbox_m2 -o /tmp/m2             boards/a2n20v2-Enhanced/hdl/media_mailbox_slot3.sv             boards/a2n20v2-Enhanced/tests/tb_media_mailbox_m2.sv
          vvp /tmp/m2
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          grep -q 'case FSOP_MEDIA_LIST_OPEN:' "$MCU/disk.c"
          grep -q 'case FSOP_MEDIA_LIST_NEXT:' "$MCU/disk.c"
          grep -q 'case FSOP_MEDIA_LIST_CLOSE:' "$MCU/disk.c"
          grep -q 'mod_audio_jukebox_start_from_file(path)' "$MCU/media_mailbox.c"
      - name: M2 MCU request handler and FAT picker host integration
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 \
            -Iboards/a2n20v2-Enhanced/tests/p1d_mock \
            -I"$MCU" -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware \
            boards/a2n20v2-Enhanced/tests/test_media_mailbox_m2.c -o /tmp/m2_mcu
          /tmp/m2_mcu
      - name: M2 guarded BL616 Stage2 helper smoke
        run: |
          git checkout -B petar/media-m2-bidir-fat-picker-20261122 HEAD
          pwsh -NoProfile -File ./M2.ps1 Help
          pwsh -NoProfile -File ./M2.ps1 SourceState > /tmp/m2_source.txt
          grep -q 'Git tracked files are clean' /tmp/m2_source.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('M2.ps1').read_text()
          assert "petar/media-m2-bidir-fat-picker-20261122" in s
          assert "'M2 FAT REPLY=YES'" in s
          assert "'MOD JUKE=STARTFILE'" in s
          assert "$flashArgs=@('--stage2', $firmware" in s
          assert "'0x40000'" in s and "'--skip-verify'" in s
          assert "--stage1" not in s
          print("PASS M2 protected Stage2, exact branch and audio signatures")
          PY
      - name: Preserve BL616 stereo PCM HDMI stream on SPACE6
        run: |
          iverilog -g2012 -s tb_mcu_stereo_pcm_bridge -o /tmp/pcm boards/a2n20v2-Enhanced/hdl/mcu_stereo_pcm_bridge.sv boards/a2n20v2-Enhanced/tests/tb_mcu_stereo_pcm_bridge.sv
          vvp /tmp/pcm
      - name: Preserve August native IIgs Ensoniq DOC SWAP
        run: |
          iverilog -g2012 -s tb_native_doc_swap_no_ntp -o /tmp/doc hdl/sound/doc5503.sv boards/a2n20v2-Enhanced/tests/tb_native_doc_swap_no_ntp.sv
          vvp /tmp/doc
      - name: Compile BL616 mailbox and MOD code without SDK
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          gcc -std=gnu11 -Wall -Wextra -Werror -fsyntax-only -Iboards/a2n20v2-Enhanced/tests/p1d_mock -I"$MCU" -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware -DHXCMOD_MAXCHANNELS=8 "$MCU/media_mailbox.c" "$MCU/mcu_mod_audio.c" "$MCU/mcu_mod_gain.c" "$MCU/mcu_mod_now_playing.c" "$MCU/mcu_mod_jukebox.c" "$MCU/mcu_mod_format.c" "$MCU/mcu_mod_sample_store.c" "$MCU/mcu_mod_pattern_store.c"
          gcc -std=gnu11 -O2 -I"$MCU/third_party/hxcmod" boards/a2n20v2-Enhanced/tests/test_mcu_hxcmod_pcm.c "$MCU/third_party/hxcmod/hxcmod.c" -o /tmp/hxcmod
          /tmp/hxcmod
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -Iboards/a2n20v2-Enhanced/tests/p1d_mock -I"$MCU" boards/a2n20v2-Enhanced/tests/test_mcu_jukebox_scan.c "$MCU/mcu_mod_jukebox.c" -o /tmp/juke
          /tmp/juke
          gcc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter -O2 -DHXCMOD_MAXCHANNELS=8 -I"$MCU" -I"$MCU/third_party/hxcmod" -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware \
            boards/a2n20v2-Enhanced/tests/test_mcu_mod_large.c \
            "$MCU/mcu_mod_format.c" "$MCU/mcu_mod_sample_store.c" \
            "$MCU/third_party/hxcmod/hxcmod.c" -o /tmp/mod_j2_large
          /tmp/mod_j2_large
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -pthread -I"$MCU" \
            boards/a2n20v2-Enhanced/tests/test_mcu_mod_now_playing.c \
            "$MCU/mcu_mod_now_playing.c" -o /tmp/mod_now_playing
          /tmp/mod_now_playing
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -I"$MCU" \
            boards/a2n20v2-Enhanced/tests/test_mcu_mod_gain.c \
            "$MCU/mcu_mod_gain.c" -o /tmp/mod_gain
          /tmp/mod_gain
          gcc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter -O2 \
            -DHXCMOD_MAXCHANNELS=8 -I"$MCU" -I"$MCU/third_party/hxcmod" \
            -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware \
            boards/a2n20v2-Enhanced/tests/test_mcu_mod_multichannel.c \
            "$MCU/mcu_mod_format.c" "$MCU/mcu_mod_sample_store.c" \
            "$MCU/third_party/hxcmod/hxcmod.c" -o /tmp/mod_multichannel
          /tmp/mod_multichannel
          gcc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter -O2 \
            -DHXCMOD_MAXCHANNELS=8 -I"$MCU" -I"$MCU/third_party/hxcmod" \
            -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware \
            boards/a2n20v2-Enhanced/tests/test_mcu_mod_pattern_cache.c \
            "$MCU/mcu_mod_format.c" "$MCU/mcu_mod_sample_store.c" \
            "$MCU/mcu_mod_pattern_store.c" "$MCU/third_party/hxcmod/hxcmod.c" \
            -o /tmp/mod_pattern_cache
          /tmp/mod_pattern_cache
          # A/B comparison: both sample cache page sizes must preserve exact
          # full-memory HxCMOD parity and reject unsupported tracker signatures.
          gcc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter -O2 \
            -DMOD_STORE_PAGE=4096u -DHXCMOD_MAXCHANNELS=8 \
            -I"$MCU" -I"$MCU/third_party/hxcmod" \
            -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware \
            boards/a2n20v2-Enhanced/tests/test_mcu_mod_multichannel.c \
            "$MCU/mcu_mod_format.c" "$MCU/mcu_mod_sample_store.c" \
            "$MCU/third_party/hxcmod/hxcmod.c" -o /tmp/mod_multichannel_4k
          /tmp/mod_multichannel_4k
          gcc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter -O2 \
            -DMOD_STORE_PAGE=4096u -DHXCMOD_MAXCHANNELS=8 \
            -I"$MCU" -I"$MCU/third_party/hxcmod" \
            -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware \
            boards/a2n20v2-Enhanced/tests/test_mcu_mod_large.c \
            "$MCU/mcu_mod_format.c" "$MCU/mcu_mod_sample_store.c" \
            "$MCU/third_party/hxcmod/hxcmod.c" -o /tmp/mod_j2_large_4k
          /tmp/mod_j2_large_4k
      - name: J2R11 jukebox selectable starting track and safe resume
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 \
            -Iboards/a2n20v2-Enhanced/tests/p1d_mock -I"$MCU" \
            boards/a2n20v2-Enhanced/tests/test_mcu_jukebox_scan.c \
            "$MCU/mcu_mod_jukebox.c" -o /tmp/j2r11_juke
          /tmp/j2r11_juke
          python3 - <<'PY'
          from pathlib import Path
          a=Path("boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/mcu_mod_audio.c").read_text()
          menu=Path("boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/menu.c").read_text()
          assert "mod_audio_jukebox_start_from_file(full)" in menu
          assert "JUKEBOX START AT .MOD" in menu
          assert "RESUME LAST JUKEBOX TRACK" in menu
          assert "LAST JUKE TRACK" in menu
          assert "mod_audio_jukebox_last_track" in a
          assert "mod_jukebox_find(juke_start_file)" in a
          assert "juke_active=playlist_play(&juke_index,(unsigned)first)" in a
          assert "MOD_JUKE_START_MISSING" in a
          assert "juke_active=playlist_play(&juke_index,juke_index)" in a
          assert "MOD JUKE=STARTFILE" in a
          print("PASS J2R11 start-at-picked-file, sorted seek and same-session resume contract")
          PY
      - name: J2R11 Stage2-only PowerShell script smoke
        run: |
          git checkout -B petar/mod-j2r11-jukebox-startfile-20261122 HEAD
          pwsh -NoProfile -File ./J2R11.ps1 Help
          pwsh -NoProfile -File ./J2R11.ps1 SourceState > /tmp/j2r11_source.txt
          grep -q 'Git tracked files are clean' /tmp/j2r11_source.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('J2R11.ps1').read_text()
          assert "petar/mod-j2r11-jukebox-startfile-20261122" in s
          assert "'MOD JUKE=STARTFILE'" in s
          assert "$flashArgs=@('--stage2', $firmware" in s
          assert "'0x40000'" in s and "'--skip-verify'" in s
          assert "--stage1" not in s
          print("PASS J2R11 guarded Stage2/known-binary helper")
          PY
      - name: J2R10 quiet-console MCU / SSI counter-off regressions
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          MOCK=boards/a2n20v2-Enhanced/tests/j2r10_osd_mock
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -I"$MOCK" -I"$MCU" \
            boards/a2n20v2-Enhanced/tests/test_j2r10_osd_batch.c \
            "$MCU/osd_console.c" -o /tmp/j2r10_osd
          /tmp/j2r10_osd
          # Exercise both speech telemetry modes so the controls can be
          # restored later without touching the working speech synth code.
          for enabled in 0 1; do
            gcc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter \
              -DSSI263_DIAG_COUNTERS=${enabled} -fsyntax-only \
              -Itests/ssi263_hybrid/stubs -I"$MCU" \
              -Ireference/ssi263/pico-v1.0.1 "$MCU/ssi263_hybrid.c"
          done
          grep -q 'set(SSI263_DIAG_COUNTERS 0 CACHE STRING' "$MCU/CMakeLists.txt"
          grep -q 'if(++window>=1536u)' "$MCU/mcu_mod_audio.c"
      - name: J2R10 FPGA SSI telemetry-trim contract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
          iverilog -g2012 -s tb_ssi263_hybrid_bridge -o /tmp/j2r10_ssi_legacy.vvp \
            boards/a2n20v2-Enhanced/hdl/ssi263_hybrid_bridge.sv \
            tests/ssi263_hybrid/tb_ssi263_hybrid_bridge.sv
          vvp /tmp/j2r10_ssi_legacy.vvp
          iverilog -g2012 -s tb_ssi263_quiet_counters -o /tmp/j2r10_ssi_quiet.vvp \
            boards/a2n20v2-Enhanced/hdl/ssi263_hybrid_bridge.sv \
            tests/ssi263_hybrid/tb_ssi263_quiet_counters.sv
          vvp /tmp/j2r10_ssi_quiet.vvp
          grep -q "ENABLE_PERF_COUNTERS(1'b0)" boards/a2n20v2-Enhanced/hdl/top.sv
      - name: J2R10 Stage2 PowerShell helper smoke
        run: |
          git checkout -B petar/mod-j2r10-quiet-console-20261122 HEAD
          pwsh -NoProfile -File ./J2R10.ps1 Help
          pwsh -NoProfile -File ./J2R10.ps1 SourceState > /tmp/j2r10_source.txt
          grep -q 'Git tracked files are clean' /tmp/j2r10_source.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('J2R10.ps1').read_text()
          assert "'MOD LOG=QUIET1HZ'" in p
          assert "petar/mod-j2r10-quiet-console-20261122" in p
          assert "$flashArgs=@('--stage2', $firmware" in p
          assert "'--skip-verify'" in p and "'0x40000'" in p
          assert "--stage1" not in p
          print("PASS J2R10 guarded Stage2 / QUIET1HZ firmware")
          PY
      - name: J2R9B MCU Stage2 PowerShell helper smoke
        run: |
          git checkout -B petar/mod-j2r9b-2k-sample-subpages-20261122 HEAD
          pwsh -NoProfile -File ./J2R9B.ps1 Help
          pwsh -NoProfile -File ./J2R9B.ps1 SourceState > /tmp/j2r9b_source.txt
          grep -q 'Git tracked files are clean' /tmp/j2r9b_source.txt
          grep -q 'Source diff SHA256' /tmp/j2r9b_source.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('J2R9B.ps1').read_text()
          assert "petar/mod-j2r9b-2k-sample-subpages-20261122" in p
          assert "'MOD SMP WIN=4x2048B'" in p
          assert "'MOD SPI=PCM512 SDRAM=BYTE'" in p
          assert "$flashArgs=@('--stage2', $firmware" in p
          assert "'--skip-verify'" in p and "'0x40000'" in p
          assert "--stage1" not in p
          print("PASS J2R9B guarded Stage2: 2KiB windows, PCM-only bulk")
          PY
      - name: J2R9B per-voice PCM window retention and latency regression
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          for bytes in 2048 4096 8192; do
            gcc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter -O2 \
              -DMOD_STORE_FETCH_BYTES=${bytes}u -DHXCMOD_MAXCHANNELS=8 \
              -I"$MCU" -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware \
              boards/a2n20v2-Enhanced/tests/test_mcu_mod_sample_windows.c \
              "$MCU/mcu_mod_sample_store.c" -o /tmp/j2r9b_window_${bytes}
            /tmp/j2r9b_window_${bytes}
          done
          # Verify the actual hardware default is 8KiB retained per voice
          # but each blocking bytewise SDRAM miss is 2KiB or less.
          grep -q 'set(MOD_STORE_FETCH_BYTES 2048 CACHE STRING' "$MCU/CMakeLists.txt"
          grep -q 'MOD SMP WIN=4x2048B' "$MCU/mcu_mod_audio.c"
      - name: Smoke-test J2R8 Stage2-only PowerShell helper
        run: |
          pwsh -NoProfile -File ./J2R8.ps1 Help
          # On pull_request checkout HEAD is detached. Give the helper the
          # expected branch name in the throwaway CI workspace.
          git checkout -B petar/mod-j2r8-16kpattern-8ksample-20261121 HEAD
          pwsh -NoProfile -File ./J2R8.ps1 SourceState > /tmp/j2r8_clean.txt
          grep -q 'Git tracked files are clean' /tmp/j2r8_clean.txt
          printf '\n# CI-only tracked change\n' >> J2R8.ps1
          pwsh -NoProfile -File ./J2R8.ps1 SourceState > /tmp/j2r8_dirty.txt
          grep -q 'Source diff SHA256' /tmp/j2r8_dirty.txt
          if cmp -s /tmp/j2r8_clean.txt /tmp/j2r8_dirty.txt; then
            echo 'ERROR: modified tracked source did not change source-state output'
            exit 1
          fi
          git restore J2R8.ps1
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          s=Path('J2R8.ps1').read_text()
          assert "Invoke-Programmer -arguments $flashArgs" in s
          assert "$flashArgs=@('--stage2', $firmware" in s
          assert "'--skip-verify'" in s
          assert "'0x40000'" in s
          assert "--stage1" not in s
          assert "VerifyReadback" in s and "CheckRuntime" in s
          print("PASS J2R8 PowerShell wrapper: Stage2-only, no Stage1 path")
          PY
      - name: J2R9 PowerShell MCU Stage2 helper smoke
        run: |
          # Detached PR HEAD and earlier J2R8 smoke used a temporary branch.
          git checkout -B petar/mod-j2r9-bulk-spi-cheer-20261121 HEAD
          pwsh -NoProfile -File ./J2R9.ps1 Help
          pwsh -NoProfile -File ./J2R9.ps1 SourceState > /tmp/j2r9_source.txt
          grep -q 'Git tracked files are clean' /tmp/j2r9_source.txt
          grep -q 'Source diff SHA256' /tmp/j2r9_source.txt
          # The repository checks in an output .bin; compiling overwrites it.
          # A changed binary MUST NOT change the source fingerprint, because
          # its SHA256 is checked separately in the build/flash manifest.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/build/build_out/a2n20_bl616_host_bl616.bin')
          assert p.is_file(), 'tracked BL616 firmware fixture must exist'
          p.write_bytes(p.read_bytes()+b'J2R9-CI-GENERATED')
          PY
          pwsh -NoProfile -File ./J2R9.ps1 SourceState > /tmp/j2r9_binary.txt
          diff -u /tmp/j2r9_source.txt /tmp/j2r9_binary.txt
          git restore -- boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/build/build_out/a2n20_bl616_host_bl616.bin
          # Conversely, a real tracked source edit MUST alter the fingerprint.
          printf '\n# J2R9 CI SOURCE CHANGE\n' >> J2R9.ps1
          pwsh -NoProfile -File ./J2R9.ps1 SourceState > /tmp/j2r9_modified.txt
          if diff -q /tmp/j2r9_source.txt /tmp/j2r9_modified.txt; then
            echo "FAIL: actual source edit did not change source fingerprint"
            exit 1
          fi
          git restore -- J2R9.ps1
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          p=Path('J2R9.ps1').read_text()
          assert "petar/mod-j2r9-bulk-spi-cheer-20261121" in p
          assert "'MOD SPI=BULK512'" in p
          assert "$flashArgs=@('--stage2', $firmware" in p
          assert "'--skip-verify'" in p and "'0x40000'" in p
          assert "--stage1" not in p
          print("PASS J2R9 PowerShell: J2R9 source / bulk signature / Stage2 only")
          PY
      - name: J2R9A PowerShell Stage2 helper smoke
        run: |
          git checkout -B petar/mod-j2r9a-pcm-only-bulk-20261122 HEAD
          pwsh -NoProfile -File ./J2R9A.ps1 Help
          pwsh -NoProfile -File ./J2R9A.ps1 SourceState > /tmp/j2r9a_source.txt
          grep -q 'Git tracked files are clean' /tmp/j2r9a_source.txt
          grep -q 'Source diff SHA256' /tmp/j2r9a_source.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('J2R9A.ps1').read_text()
          assert "petar/mod-j2r9a-pcm-only-bulk-20261122" in p
          assert "'MOD SPI=PCM512 SDRAM=BYTE'" in p
          assert "$flashArgs=@('--stage2', $firmware" in p
          assert "'--skip-verify'" in p and "'0x40000'" in p
          assert "--stage1" not in p
          print("PASS J2R9A PowerShell: guarded PCM512 Stage2-only build")
          PY
      - name: J2R9a real SPI transport tests (PCM-only, legacy, unsafe-lab)
        run: |
          SPI=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware
          MOCK=boards/a2n20v2-Enhanced/tests/j2r9_spi_mock
          TEST=boards/a2n20v2-Enhanced/tests/test_fpga_spi_j2r9_bulk.c
          # New deployable default: HDMI PCM bursts, bytewise SDRAM only.
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 \
            -DFPGA_SPI_MOD_BULK_XFER=1 -DFPGA_SPI_MOD_BULK_SDRAM=0 \
            -I"$MOCK" -I"$SPI" "$TEST" "$SPI/fpga_spi.c" -o /tmp/j2r9a_pcm
          /tmp/j2r9a_pcm
          # Entirely known-good bytewise path remains available as fallback.
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 \
            -DFPGA_SPI_MOD_BULK_XFER=0 -DFPGA_SPI_MOD_BULK_SDRAM=0 \
            -I"$MOCK" -I"$SPI" "$TEST" "$SPI/fpga_spi.c" -o /tmp/j2r9a_legacy
          /tmp/j2r9a_legacy
          # Experimental all-bulk is mock-tested ONLY, NOT the physical default.
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 \
            -DFPGA_SPI_MOD_BULK_XFER=1 -DFPGA_SPI_MOD_BULK_SDRAM=1 \
            -I"$MOCK" -I"$SPI" "$TEST" "$SPI/fpga_spi.c" -o /tmp/j2r9a_full_lab
          /tmp/j2r9a_full_lab
          grep -q 'FPGA_SPI_MOD_BULK_SDRAM 0 CACHE STRING' boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/CMakeLists.txt
          grep -q 'MOD SPI=PCM512 SDRAM=BYTE' boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/mcu_mod_audio.c
      - name: Check ROMless slot3 address, preserve other hardware routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('boards/a2n20v2-Enhanced')
          m=root/'src/a2n20_bl616/firmware_host'
          top=(root/'hdl/top.sv').read_text()
          mb=(root/'hdl/media_mailbox_slot3.sv').read_text()
          glu=Path('hdl/sound/sound_glu.sv').read_text()
          gowin=(root/'a2n20v2_enhanced.gprj').read_text()
