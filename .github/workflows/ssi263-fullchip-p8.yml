name: P8 SSI263 pinned silicon model reference checks
on:
  push:
    branches:
      - petar/ssi263-fullchip-p8-reference-20261109
    paths:
      - "reference/ssi263/**"
      - "tools/generate_ssi263_p8_roms.py"
      - "hdl/mockingboard/ssi263_p8_chip.sv"
      - "tests/mb_ssi263/tb_ssi263_p8_chip.sv"
      - "boards/a2n20v2-Enhanced/hdl/ssi263_p8_*.mem"
      - ".github/workflows/ssi263-fullchip-p8.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the exact Mockingboard Pico pinned MIT SSI263 model
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Ireference/ssi263/pico-v1.0.1 reference/ssi263/p8_reference_gate.c reference/ssi263/pico-v1.0.1/ssi263.c reference/ssi263/pico-v1.0.1/ssi263dsp.c -lm -o /tmp/p8_ssi263_reference
      - name: Exercise real model register, ROM and native PCM synthesis
        run: |
          /tmp/p8_ssi263_reference /tmp/p8_reference.pcm
          test "$(stat -c%s /tmp/p8_reference.pcm)" -eq 307200
          sha256sum /tmp/p8_reference.pcm
      - name: Validate recovered die ROM provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('reference/ssi263/pico-v1.0.1/rom_bits.csv').read_text().splitlines()
          assert len([s for s in t if s.startswith('0x')])==64
          assert Path('reference/ssi263/pico-v1.0.1/LICENSE').exists()
          assert Path('reference/ssi263/pico-v1.0.1/NOTICE.md').exists()
          print('PASS: 64 physical die parameter rows and attribution present')
          PY

  fpga-chip-bringup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: Assert FPGA ROMs match pinned C reference
        run: python3 tools/generate_ssi263_p8_roms.py --check
      - name: Simulate independent P8 chip register/DSP chain
        run: |
          iverilog -g2012 -s tb_ssi263_p8_chip -o /tmp/p8chip.vvp hdl/mockingboard/ssi263_p8_chip.sv tests/mb_ssi263/tb_ssi263_p8_chip.sv
          (cd boards/a2n20v2-Enhanced && vvp /tmp/p8chip.vvp)
      - name: Lint stand-alone P8 chip
        run: |
          (cd boards/a2n20v2-Enhanced && verilator --lint-only --timing -Wno-fatal --top-module ssi263_p8_chip ../../hdl/mockingboard/ssi263_p8_chip.sv)
