name: P10 R11 acknowledged SPI PCM suspend/resume
on:
  push:
    branches:
      - petar/ssi263-p10r11-spi-suspend-wargames-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HDL and optional Apple II tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog verilator cc65
      - name: R11 + existing FPGA bridge regressions
        run: |
          iverilog -g2012 -Wall -s tb_ssi263_hybrid_bridge -o /tmp/p10.vvp boards/a2n20v2-Enhanced/hdl/ssi263_hybrid_bridge.sv tests/ssi263_hybrid/tb_ssi263_hybrid_bridge.sv
          vvp /tmp/p10.vvp
          iverilog -g2012 -Wall -s tb_ssi263_p10r6_multirate -o /tmp/p10r6.vvp boards/a2n20v2-Enhanced/hdl/ssi263_hybrid_bridge.sv tests/ssi263_hybrid/tb_ssi263_p10r6_multirate.sv
          vvp /tmp/p10r6.vvp
          iverilog -g2012 -Wall -s tb_ssi263_p10r11_pcm_suspend -o /tmp/p10r11.vvp boards/a2n20v2-Enhanced/hdl/ssi263_hybrid_bridge.sv tests/ssi263_hybrid/tb_ssi263_p10r11_pcm_suspend.sv
          vvp /tmp/p10r11.vvp
          verilator --lint-only --timing -Wno-fatal --top-module ssi263_hybrid_bridge boards/a2n20v2-Enhanced/hdl/ssi263_hybrid_bridge.sv
      - name: Host syntax and R10 model continuity
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -fsyntax-only -DSSI263_PCM_RATE_DIV=2 -Itests/ssi263_hybrid/stubs -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host -Ireference/ssi263/pico-v1.0.1 boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/ssi263_hybrid.c
          gcc -std=c99 -O2 -Wall -Wextra -Werror -fsyntax-only -DSSI263_PCM_RATE_DIV=4 -Itests/ssi263_hybrid/stubs -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host -Ireference/ssi263/pico-v1.0.1 boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/ssi263_hybrid.c
          gcc -std=c99 -O3 -fsingle-precision-constant -Wall -Wextra -Werror -DSSI263_DIGITAL_NO_CARRIER=1 -DSSI263_R8_FAST_SWELL=1 -Ireference/ssi263/pico-v1.0.1 -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host tests/ssi263_hybrid/test_p10_r10_idle_resume.c reference/ssi263/pico-v1.0.1/ssi263.c reference/ssi263/pico-v1.0.1/ssi263dsp.c -lm -o /tmp/r10-idle
          /tmp/r10-idle
      - name: Assert R11 protocol capability and safe fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sv=Path("boards/a2n20v2-Enhanced/hdl/ssi263_hybrid_bridge.sv").read_text()
          c=Path("boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/ssi263_hybrid.c").read_text()
          assert "24'h800002" in sv and "8'hB7" in sv
          assert "pcm_suspended_r" in sv
          assert "SSI_SUSPEND_CAP    0xB7u" in c
          assert "set_pcm_suspend(false)" in c
          assert "set_pcm_suspend(true)" in c
          assert "if(pcm_suspended)" in c
          assert "pcm_suspend_supported" in c
          assert "SSI263_DIGITAL_NO_CARRIER" in Path("boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host/CMakeLists.txt").read_text()
          print("PASS: R11 SPI PCM suspend handshake + R10 fallback")
          PY
      - name: Assemble Apple II slot-4 WOPR test and build SSI digital speech preview
        run: |
          ca65 -o /tmp/wargames.o examples/ssi263_wargames/wargames_slot4.s
          ld65 -C examples/ssi263_wargames/apple2_6000.cfg -o /tmp/wargames.raw /tmp/wargames.o
          test $(stat -c%s /tmp/wargames.raw) -gt 30
          gcc -std=c99 -O3 -fsingle-precision-constant -Wall -Wextra -Werror -DSSI263_DIGITAL_NO_CARRIER=1 -DSSI263_R8_FAST_SWELL=1 -Ireference/ssi263/pico-v1.0.1 examples/ssi263_wargames/render_wargames.c reference/ssi263/pico-v1.0.1/ssi263.c reference/ssi263/pico-v1.0.1/ssi263dsp.c -lm -o /tmp/wargames_preview
          /tmp/wargames_preview /tmp/wargames_ssi263.wav
          test $(stat -c%s /tmp/wargames_ssi263.wav) -gt 44044
          python3 - <<'PY'
          from pathlib import Path
          a=Path('examples/ssi263_wargames/wargames_slot4.s').read_text()
          b=Path('examples/ssi263_wargames/render_wargames.c').read_text()
          import re
          asm=re.findall(r'\.byte\s+((?:\$[0-9a-fA-F]{2}(?:\s*,\s*)?)+)',a)
          values=[int(h,16) for group in asm for h in re.findall(r'\$([0-9a-fA-F]{2})',group)]
          cvals=[int(h,16) for h in re.findall(r'0x([0-9a-fA-F]{2})',b.split('static const uint8_t phrase[]=',1)[1].split('};',1)[0])]
          assert values[:len(cvals)]==cvals,(values,cvals)
          print('PASS: Apple II source and Pico preview use identical SSI-263 phoneme bytes')
          PY
      - name: Build and validate WOPR staccato Take 2 independently
        run: |
          ca65 -o /tmp/wargames_staccato.o examples/ssi263_wargames/wargames_slot4_staccato.s
          ld65 -C examples/ssi263_wargames/apple2_6000.cfg -o /tmp/wargames_staccato.raw /tmp/wargames_staccato.o
          test $(stat -c%s /tmp/wargames_staccato.raw) -gt 30
          gcc -std=c99 -O3 -fsingle-precision-constant -Wall -Wextra -Werror -DSSI263_DIGITAL_NO_CARRIER=1 -DSSI263_R8_FAST_SWELL=1 -Ireference/ssi263/pico-v1.0.1 examples/ssi263_wargames/render_wargames_staccato.c reference/ssi263/pico-v1.0.1/ssi263.c reference/ssi263/pico-v1.0.1/ssi263dsp.c -lm -o /tmp/wargames_staccato_preview
          /tmp/wargames_staccato_preview /tmp/wargames_ssi263_staccato.wav
          python3 - <<'PY'
          from pathlib import Path
          import re, wave
          a=Path('examples/ssi263_wargames/wargames_slot4_staccato.s').read_text()
          b=Path('examples/ssi263_wargames/render_wargames_staccato.c').read_text()
          asm=re.findall(r'\.byte\s+((?:\$[0-9a-fA-F]{2}(?:\s*,\s*)?)+)',a)
          values=[int(h,16) for group in asm for h in re.findall(r'\$([0-9a-fA-F]{2})',group)]
          cvals=[int(h,16) for h in re.findall(r'0x([0-9a-fA-F]{2})',b.split('static const uint8_t phrase[]=',1)[1].split('};',1)[0])]
          assert values[:len(cvals)]==cvals and len(cvals)==22,(values,cvals)
          with wave.open('/tmp/wargames_ssi263.wav','rb') as w:
            v1_sec=w.getnframes()/w.getframerate()
          with wave.open('/tmp/wargames_ssi263_staccato.wav','rb') as w:
            v2_sec=w.getnframes()/w.getframerate()
          assert 2.65<v2_sec<3.30,(v1_sec,v2_sec)
          assert v2_sec>v1_sec+0.45,(v1_sec,v2_sec)
          print(f'PASS: WOPR original={v1_sec:.3f}s staccato={v2_sec:.3f}s; identical 22 ROM phoneme bytes in Apple II and C preview')
          PY
      - name: Instrument Pico pitch target and realized oscillator by word
        run: |
          gcc -std=c99 -O3 -fsingle-precision-constant -Wall -Wextra -Werror -DSSI263_DIGITAL_NO_CARRIER=1 -DSSI263_R8_FAST_SWELL=1 -Ireference/ssi263/pico-v1.0.1 tests/ssi263_hybrid/test_wargames_pitch_probe.c reference/ssi263/pico-v1.0.1/ssi263.c reference/ssi263/pico-v1.0.1/ssi263dsp.c -lm -o /tmp/wargames_pitch_probe
          /tmp/wargames_pitch_probe
      - name: Build and validate Take 3 film-timed SSI-263 phrase
        run: |
          ca65 -o /tmp/wargames_film_timing.o examples/ssi263_wargames/wargames_slot4_film_timing.s
          ld65 -C examples/ssi263_wargames/apple2_6000.cfg -o /tmp/wargames_film_timing.raw /tmp/wargames_film_timing.o
          test $(stat -c%s /tmp/wargames_film_timing.raw) -gt 30
          gcc -std=c99 -O3 -fsingle-precision-constant -Wall -Wextra -Werror -DSSI263_DIGITAL_NO_CARRIER=1 -DSSI263_R8_FAST_SWELL=1 -Ireference/ssi263/pico-v1.0.1 examples/ssi263_wargames/render_wargames_film_timing.c reference/ssi263/pico-v1.0.1/ssi263.c reference/ssi263/pico-v1.0.1/ssi263dsp.c -lm -o /tmp/wargames_film_timing_preview
          /tmp/wargames_film_timing_preview /tmp/wargames_ssi263_film_timing.wav
          python3 - <<'PY'
          from pathlib import Path
          import re, wave
          a=Path('examples/ssi263_wargames/wargames_slot4_film_timing.s').read_text()
          b=Path('examples/ssi263_wargames/render_wargames_film_timing.c').read_text()
          score=a.split('phrase:',1)[1].split('phrase_end:',1)[0]
          vals=[int(x,16) for x in re.findall(r'\$([0-9A-Fa-f]{2})',score)]
          arr=b.split('static const uint8_t phrase[]={',1)[1].split('};',1)[0]
          cvals=[int(x,16) for x in re.findall(r'0x([0-9A-Fa-f]{2})',arr)]
          assert vals==cvals and len(cvals)==17,(vals,cvals)
          for j,n in [(4,0x43),(7,0x53),(12,0x83)]:
            assert f'cpy #{j}' in a
            assert f'lda #${n:02X}' in a
            assert f'if(i=={j})' in b and f'0x{n:02X}' in b
          duration=[]
          for f in ['/tmp/wargames_ssi263.wav','/tmp/wargames_ssi263_staccato.wav','/tmp/wargames_ssi263_film_timing.wav']:
            with wave.open(f,'rb') as w:
              duration.append(w.getnframes()/w.getframerate())
          assert 2.00<duration[2]<2.45,duration
          assert duration[2]<duration[1]-0.30,duration
          print(f'PASS WOPR: Take1={duration[0]:.3f}s Take2={duration[1]:.3f}s Film-timed={duration[2]:.3f}s; identical 17 ROM bytes')
          PY
      - name: WOPR Take 4 actual model pitch-curve and ROM parity
        run: |
          ca65 -o /tmp/wargames_movie_curve.o examples/ssi263_wargames/wargames_slot4_movie_curve.s
          ld65 -C examples/ssi263_wargames/apple2_6000.cfg -o /tmp/wargames_movie_curve.raw /tmp/wargames_movie_curve.o
          test $(stat -c%s /tmp/wargames_movie_curve.raw) -gt 30
          gcc -std=c99 -O3 -fsingle-precision-constant -Wall -Wextra -Werror -DSSI263_DIGITAL_NO_CARRIER=1 -DSSI263_R8_FAST_SWELL=1 -Ireference/ssi263/pico-v1.0.1 examples/ssi263_wargames/render_wargames_movie_curve.c reference/ssi263/pico-v1.0.1/ssi263.c reference/ssi263/pico-v1.0.1/ssi263dsp.c -lm -o /tmp/wargames_movie_curve_preview
          /tmp/wargames_movie_curve_preview /tmp/wargames_ssi263_movie_curve.wav
          python3 - <<'PY'
          import re,wave
          from pathlib import Path
          a=Path('examples/ssi263_wargames/wargames_slot4_movie_curve.s').read_text()
          b=Path('examples/ssi263_wargames/render_wargames_movie_curve.c').read_text()
          score=a.split('phrase:',1)[1].split('phrase_end:',1)[0]
          vals=[int(h,16) for h in re.findall(r'\$([0-9a-fA-F]{2})',score)]
          phrase=b.split('static const uint8_t phrase[]={',1)[1].split('};',1)[0]
          cvals=[int(h,16) for h in re.findall(r'0x([0-9a-fA-F]{2})',phrase)]
          assert vals==cvals and len(vals)==17,(vals,cvals)
          for j,n in [(4,0x3B),(7,0x53),(12,0x83),(14,0xAB)]:
            assert f'cpy #{j}' in a and ('lda #$'+f'{n:02X}') in a
            assert f'if(i=={j})' in b and f'0x{n:02X}' in b
          with wave.open('/tmp/wargames_ssi263_movie_curve.wav','rb') as w:
            duration=w.getnframes()/w.getframerate()
          assert 2.0<duration<2.4,duration
          print(f'PASS WOPR TAKE4: 17 identical R0 bytes, all R1 changes, {duration:.3f}s')
          PY
      - name: WOPR Take 4B extra staccato real-model + ROM parity
        run: |
          ca65 -o /tmp/wargames_punctuated.o examples/ssi263_wargames/wargames_slot4_punctuated.s
          ld65 -C examples/ssi263_wargames/apple2_6000.cfg -o /tmp/wargames_punctuated.raw /tmp/wargames_punctuated.o
          test $(stat -c%s /tmp/wargames_punctuated.raw) -gt 30
          gcc -std=c99 -O3 -fsingle-precision-constant -Wall -Wextra -Werror -DSSI263_DIGITAL_NO_CARRIER=1 -DSSI263_R8_FAST_SWELL=1 -Ireference/ssi263/pico-v1.0.1 examples/ssi263_wargames/render_wargames_punctuated.c reference/ssi263/pico-v1.0.1/ssi263.c reference/ssi263/pico-v1.0.1/ssi263dsp.c -lm -o /tmp/wargames_punctuated_preview
          /tmp/wargames_punctuated_preview /tmp/wargames_ssi263_punctuated.wav
          python3 - <<'PY'
          import re,wave
          from pathlib import Path
          a=Path('examples/ssi263_wargames/wargames_slot4_punctuated.s').read_text()
          b=Path('examples/ssi263_wargames/render_wargames_punctuated.c').read_text()
          score=a.split('phrase:',1)[1].split('phrase_end:',1)[0]
          vals=[int(h,16) for h in re.findall(r'\$([0-9a-fA-F]{2})',score)]
          phrase=b.split('static const uint8_t phrase[]={',1)[1].split('};',1)[0]
          cvals=[int(h,16) for h in re.findall(r'0x([0-9a-fA-F]{2})',phrase)]
          assert vals==cvals and len(vals)==17,(vals,cvals)
          for j,n in [(4,0x3B),(7,0x53),(12,0x83),(14,0xAB)]:
            assert f'cpy #{j}' in a and ('lda #$'+f'{n:02X}') in a
            assert f'if(i=={j})' in b and f'0x{n:02X}' in b
          with wave.open('/tmp/wargames_ssi263_punctuated.wav','rb') as w:
            duration=w.getnframes()/w.getframerate()
          assert 2.0<duration<2.4,duration
          print(f'PASS WOPR TAKE4B: 17 identical R0 bytes, all R1 changes, {duration:.3f}s')
          PY
      - name: WOPR Take 5 'ay game' with fixed high GAME pitch
        run: |
          ca65 -o /tmp/wargames_fixed_game.o examples/ssi263_wargames/wargames_slot4_fixed_game.s
          ld65 -C examples/ssi263_wargames/apple2_6000.cfg -o /tmp/wargames_fixed_game.raw /tmp/wargames_fixed_game.o
          test $(stat -c%s /tmp/wargames_fixed_game.raw) -gt 30
          gcc -std=c99 -O3 -fsingle-precision-constant -Wall -Wextra -Werror -DSSI263_DIGITAL_NO_CARRIER=1 -DSSI263_R8_FAST_SWELL=1 -Ireference/ssi263/pico-v1.0.1 examples/ssi263_wargames/render_wargames_fixed_game.c reference/ssi263/pico-v1.0.1/ssi263.c reference/ssi263/pico-v1.0.1/ssi263dsp.c -lm -o /tmp/wargames_fixed_game_preview
          /tmp/wargames_fixed_game_preview /tmp/wargames_ssi263_fixed_game.wav
          python3 - <<'PY'
          from pathlib import Path
          import re,wave,struct
          a=Path('examples/ssi263_wargames/wargames_slot4_fixed_game.s').read_text()
          b=Path('examples/ssi263_wargames/render_wargames_fixed_game.c').read_text()
          score=a.split('phrase:',1)[1].split('phrase_end:',1)[0]
          vals=[int(h,16) for h in re.findall(r'\$([0-9A-Fa-f]{2})',score)]
          arr=b.split('static const uint8_t phrase[]={',1)[1].split('};',1)[0]
          cvals=[int(h,16) for h in re.findall(r'0x([0-9A-Fa-f]{2})',arr)]
          assert vals==cvals and len(vals)==17,(vals,cvals)
          assert vals[11]==0x45 and vals[12]==0x80,(vals[11],vals[12])
          assert all(v not in a for v in ['lda #$AB','not_final_rise'])
          assert 'if(i==14)ssi263_write(chip,1,' not in b
          assert 'cpy #11' in a and 'lda #$97' in a and 'if(i==11)ssi263_write(chip,1,0x97)' in b
          durations=[4-(v>>6) for v in vals]
          assert sum(durations)==45,sum(durations)
          assert [sum(durations[:i]) for i in [4,7,11,13]]==[12,19,27,32]
          with wave.open('/tmp/wargames_ssi263_fixed_game.wav','rb') as w:
            assert (w.getframerate(),w.getnchannels(),w.getsampwidth())==(22050,1,2)
            duration=w.getnframes()/w.getframerate()
            data=w.readframes(w.getnframes())
          peak=max(abs(v) for v in struct.unpack('<%dh'%(len(data)//2),data))
          assert 2.0<duration<2.4,duration
          assert peak<32767,peak
          print(f'PASS TAKE5: {duration:.3f}s, same 45 frames/movie word boundaries, short AY before GAME, peak={peak}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r11-wargames-ssi263-demo
          path: |
            /tmp/wargames.raw
            /tmp/wargames_ssi263.wav
            /tmp/wargames_staccato.raw
            /tmp/wargames_ssi263_staccato.wav
            /tmp/wargames_film_timing.raw
            /tmp/wargames_ssi263_film_timing.wav
            /tmp/wargames_movie_curve.raw
            /tmp/wargames_ssi263_movie_curve.wav
            /tmp/wargames_punctuated.raw
            /tmp/wargames_ssi263_punctuated.wav
            /tmp/wargames_fixed_game.raw
            /tmp/wargames_ssi263_fixed_game.wav
          if-no-files-found: error
