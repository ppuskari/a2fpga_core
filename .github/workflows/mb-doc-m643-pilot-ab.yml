name: M6.4.3 runtime HDMI pilot A/B
on:
  push:
    branches:
      - petar/mb-doc-m643-pilot-ab-20261114
    paths:
      - 'boards/a2n20v2-Enhanced/hdl/top.sv'
      - 'boards/a2n20v2-Enhanced/hdl/mb_doc_bridge.sv'
      - 'boards/a2n20v2-Enhanced/hdl/mb_hdmi_audio_pilot.sv'
      - 'boards/a2n20v2-Enhanced/a2n20v2_enhanced.gprj'
      - 'tests/mb_doc/**'
      - '.github/workflows/mb-doc-m643-pilot-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Verify diagnostic pilot, left-channel transparency and limiter
        run: sh tests/mb_doc/run_audio_pilot_test.sh
      - name: Verify Enhanced project wiring and stable settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          top=Path('boards/a2n20v2-Enhanced/hdl/top.sv').read_text()
          project=Path('boards/a2n20v2-Enhanced/a2n20v2_enhanced.gprj').read_text()
          for marker in (
              "parameter bit MB_DOC_FX_AY_BYPASS_ENABLE = 1'b0",
              "parameter bit MB_DOC_DECLICK_ENABLE = 1'b1",
              "parameter bit MB_DOC_COHERENT_PUBLISH_ENABLE = 1'b1",
              "parameter bit MB_DOC_HDMI_AUDIO_PILOT_ENABLE = 1'b1",
              ".ENABLE(1'b0),  // M6.3",
              ".sample_tick_i(clk_audio_w)",
              ".pilot_enable_i(pilot_enable_pixel_r)",
              "else if (button_s2_posedge_w)",
              "pilot_enable_pixel_meta_r <= pilot_enable_logic_r",
              ".right_pcm_o(audio_sample_word[1])",
              "mb_speech_sum_l_w",
              "mb_speech_sum_r_w",
          ):
              assert marker in top, marker
          assert 'mb_hdmi_audio_pilot.sv' in project
          print('PASS: right-only HDMI pilot; no AY FX mux, no video overlay; R11 speech preserved')
          PY
      - name: Restore verified piano ROM
        run: python3 tools/extract_synthlab_piano.py --download
      - name: Existing M6/M6.4/M6.4.1 music and publication regressions
        run: |
          sh tests/mb_doc/run_capture_test.sh
          sh tests/mb_doc/run_declick_test.sh
          sh tests/mb_doc/run_publish_test.sh
