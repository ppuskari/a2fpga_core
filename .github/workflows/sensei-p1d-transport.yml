name: SenseiPlay8 native NTP C/FPGA regression
on:
  push:
    branches:
      - petar/sensei8-p2aa-native-ntp-only-20261120
  pull_request:
  workflow_dispatch:
jobs:
  ntp-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SystemVerilog simulator
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog
      - name: Native slot mailbox, FIFO and ACK PCM transport
        run: |
          iverilog -g2012 -s tb_sensei_tracker_bridge -o /tmp/tb_bridge boards/a2n20v2-Enhanced/hdl/sensei_tracker_bridge.sv boards/a2n20v2-Enhanced/tests/tb_sensei_tracker_bridge.sv
          vvp /tmp/tb_bridge
          iverilog -g2012 -s tb_sensei_p2_pcm -o /tmp/tb_pcm boards/a2n20v2-Enhanced/hdl/sensei_tracker_bridge.sv boards/a2n20v2-Enhanced/tests/tb_sensei_p2_pcm.sv
          vvp /tmp/tb_pcm
      - name: FPGA first-waveform-end retarget versus unaffected DOC SWAP
        run: |
          iverilog -g2012 -s tb_p2y_ntp_retarget -o /tmp/tb_ntp boards/a2n20v2-Enhanced/hdl/sensei_tracker_bridge.sv boards/a2n20v2-Enhanced/tests/tb_p2y_ntp_retarget.sv hdl/sound/doc5503.sv
          vvp /tmp/tb_ntp
      - name: SDK-free BL616 NTP runtime and DOC transport compile
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          MOCK=boards/a2n20v2-Enhanced/tests/p1d_mock
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I"$MOCK" -I"$MCU" -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware "$MCU/sensei_tracker.c" "$MCU/sensei_ntp_native.c" "$MCU/sensei_runtime.c" "$MCU/sensei_ntp_import.c" "$MCU/sensei_pcm_upload.c" "$MCU/sensei_event_queue.c"
      - name: Keep NTP import and BL616 worker frames small
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          MOCK=boards/a2n20v2-Enhanced/tests/p1d_mock
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fstack-usage -c -I"$MOCK" -I"$MCU" -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware "$MCU/sensei_tracker.c" -o /tmp/p2aa_tracker.o
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fstack-usage -c -I"$MOCK" -I"$MCU" -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware "$MCU/sensei_runtime.c" -o /tmp/p2aa_runtime.o
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fstack-usage -c -I"$MCU" "$MCU/sensei_ntp_import.c" -o /tmp/p2aa_import.o
          python3 boards/a2n20v2-Enhanced/tests/check_p2z_stack.py /tmp/p2aa_tracker.su /tmp/p2aa_runtime.su /tmp/p2aa_import.su
      - name: Native original NTP v2 parsing and byte-exact DOC sample import
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          gcc -std=c11 -O2 -Wall -Wextra -Werror -I"$MCU" boards/a2n20v2-Enhanced/tests/test_p2aa_ntp_import.c "$MCU/sensei_ntp_import.c" -o /tmp/test_ntp_import
          /tmp/test_ntp_import
      - name: Native FAT selector to DOC bank, no shadow MOD allocation
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Iboards/a2n20v2-Enhanced/tests/p1d_mock -I"$MCU" boards/a2n20v2-Enhanced/tests/test_p2aa_runtime.c "$MCU/sensei_runtime.c" "$MCU/sensei_ntp_import.c" -o /tmp/test_ntp_runtime
          /tmp/test_ntp_runtime
      - name: Native NinjaTrackerPlus note, loop, effects and order flow
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          gcc -std=c11 -O2 -Wall -Wextra -Werror -I"$MCU" boards/a2n20v2-Enhanced/tests/test_p2y_ntp_native.c "$MCU/sensei_ntp_native.c" -o /tmp/test_native
          /tmp/test_native
      - name: DOC PCM uploader success/error path
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Iboards/a2n20v2-Enhanced/tests/p1d_mock -I"$MCU" -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware boards/a2n20v2-Enhanced/tests/test_p2_pcm_upload.c "$MCU/sensei_pcm_upload.c" -o /tmp/test_pcm
          /tmp/test_pcm
      - name: Reject production MOD dependencies and verify FPGA transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path("boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host")
          cm=(h/"CMakeLists.txt").read_text()
          rt=(h/"sensei_runtime.c").read_text()
          tr=(h/"sensei_tracker.c").read_text()
          im=(h/"sensei_ntp_import.c").read_text()
          menu=(h/"menu.c").read_text()
          assert "sensei_mod_player.c" not in cm and "sensei_mod_decode.c" not in cm
          assert "sensei_mod_" not in tr and "sensei_mod_" not in rt
          assert "ntp_patterns" not in rt and "pat[k]" not in im
          assert 'k_mod_exts[] = {"ntp",NULL}' in menu
          top=Path("boards/a2n20v2-Enhanced/hdl/top.sv").read_text()
          glu=Path("hdl/sound/sound_glu.sv").read_text()
          assert "pcm_ram_owner_o(trk_pcm_owner_w)" in top
          assert "tracker_ram_ready_o(trk_pcm_ready_w)" in top
          assert "tracker_owner_w" in glu and "ntp_loop_assist_i(tracker_owner_w)" in glu
          print("PASS P2AA: native-only MCU, no old MOD or score-conversion dependencies")
          print("PASS P2AA: unchanged FPGA PCM DMA, FIFO and NTP sustain assist")
          PY
