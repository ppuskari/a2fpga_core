name: BL616 MCU MOD direct HDMI PCM (no NTP/DOC tracker)
on:
  push:
    branches:
      - petar/mcupcm-hdmi-direct-mod-clean-20261120
  pull_request:
  workflow_dispatch:
jobs:
  mcupcm-hdmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog
      - name: Test FPGA stereo PCM bridge only (NO DOC instance)
        run: |
          iverilog -g2012 -s tb_mcu_stereo_pcm_bridge -o /tmp/pcm_sim boards/a2n20v2-Enhanced/hdl/mcu_stereo_pcm_bridge.sv boards/a2n20v2-Enhanced/tests/tb_mcu_stereo_pcm_bridge.sv
          vvp /tmp/pcm_sim
      - name: Test public-domain HxCMOD pure C stereo module renderer
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          gcc -std=gnu11 -O2 -I"$MCU/third_party/hxcmod" boards/a2n20v2-Enhanced/tests/test_mcu_hxcmod_pcm.c "$MCU/third_party/hxcmod/hxcmod.c" -o /tmp/hxcmod_test
          /tmp/hxcmod_test
      - name: Validate MCU MOD task compiles with SDK-free FreeRTOS mock
        run: |
          MCU=boards/a2n20v2-Enhanced/src/a2n20_bl616/firmware_host
          MOCK=boards/a2n20v2-Enhanced/tests/p1d_mock
          gcc -std=gnu11 -Wall -Wextra -Werror -fsyntax-only -I"$MOCK" -I"$MCU" -Iboards/a2n20v2-Enhanced/src/a2n20_bl616/firmware -DHXCMOD_MAXCHANNELS=4 "$MCU/mcu_mod_audio.c"
      - name: Refuse any active NTP/MCU-to-DOC integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("boards/a2n20v2-Enhanced")
          m=root/"src/a2n20_bl616/firmware_host"
          top=(root/"hdl/top.sv").read_text()
          glu=Path("hdl/sound/sound_glu.sv").read_text()
          spi=(root/"hdl/bl616/bl616_spi_connector.sv").read_text()
          cm=(m/"CMakeLists.txt").read_text()
          gowin=(root/"a2n20v2_enhanced.gprj").read_text()
          assert "sensei_" not in cm and "sensei_tracker" not in top
          assert not any(x in glu for x in ("tracker_owner_i","tracker_doc_wr_i","tracker_ram_owner_i","tracker_pcm_owner_w"))
          assert ".ntp_loop_assist_i(1'b0)" in glu
          assert "mcu_stereo_pcm_bridge" in top and "hdl/mcu_stereo_pcm_bridge.sv" in gowin
          assert "hdl/sensei_tracker_bridge.sv" not in gowin
          assert "pcm_spi_wr_o" in spi and "trk_spi_wr_o" not in spi
          assert 'k_mod_exts[] = {"mod",NULL}' in (m/"menu.c").read_text()
          assert "third_party/hxcmod/hxcmod.c" in cm
          assert "mod_audio_task" in (m/"main.c").read_text()
          assert ".tracker_" not in top
          print("PASS: no NTP C player, no FPGA NTP mailbox, no native DOC ownership")
          print("PASS: independent MCU stereo PCM->HDMI and native IIgs GLU still enabled")
          PY
