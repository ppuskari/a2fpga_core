name: Mockingboard AY capture

on:
  push:
    branches:
      - petar/mockingboard-ensoniq-p0
    paths:
      - "hdl/mockingboard/mockingboard.sv"
      - "tests/mb_doc/**"
      - ".github/workflows/mb-ay-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Simulate AY register capture
        run: sh tests/mb_doc/run_capture_test.sh
